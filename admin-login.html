<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://stemuluskidstech.com/admin-login.html" />
  <title>Admin Login — STEMulus KidsTech</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dist/combined.css">

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:        #F4600C;
      --orange-hover:  #d94f08;
      --orange-glow:   rgba(244, 96, 12, 0.35);
      --bg-start:      #0f0f1a;
      --bg-end:        #1a1a3e;
      --card-bg:       rgba(255, 255, 255, 0.04);
      --card-border:   rgba(255, 255, 255, 0.09);
      --input-bg:      rgba(255, 255, 255, 0.06);
      --input-border:  rgba(255, 255, 255, 0.13);
      --input-focus:   rgba(244, 96, 12, 0.55);
      --text-primary:  #f0f0f8;
      --text-muted:    rgba(255, 255, 255, 0.45);
      --text-subtle:   rgba(255, 255, 255, 0.28);
      --error-bg:      rgba(220, 53, 69, 0.15);
      --error-border:  rgba(220, 53, 69, 0.5);
      --error-text:    #ff6b7a;
      --success-bg:    rgba(40, 167, 69, 0.15);
      --success-border:rgba(40, 167, 69, 0.45);
      --success-text:  #6ecf88;
      --radius:        14px;
      --radius-sm:     9px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background particles ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 15% 20%, rgba(100, 60, 220, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 85% 80%, rgba(244, 96, 12, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(60, 80, 200, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Page Layout ── */
    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 44px 40px 36px;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 4px 6px rgba(0,0,0,0.18),
        0 20px 60px rgba(0,0,0,0.45),
        0 0 120px rgba(100, 60, 220, 0.08);
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      height: 54px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 12px rgba(244, 96, 12, 0.25));
    }

    /* ── Portal Label ── */
    .portal-label {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 10px;
    }

    /* ── Headings ── */
    .heading {
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 7px;
      letter-spacing: 0.04em;
    }

    /* Input with icon wrapper */
    .input-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-wrap .icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .input-icon-wrap input:focus ~ .icon-left,
    .input-icon-wrap input:focus + .icon-left {
      color: var(--orange);
    }

    /* Re-order so icon-left comes after input for :focus + adjacent sibling trick */
    /* Instead we use JS approach — just style the parent on focus-within */
    .input-icon-wrap:focus-within .icon-left {
      color: var(--orange);
    }

    .input-icon-wrap input {
      width: 100%;
      padding: 12px 44px 12px 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.22s, background 0.22s, box-shadow 0.22s;
    }

    /* password field — no right padding needed if no toggle? We add it for toggle */
    .input-icon-wrap input[type="password"],
    .input-icon-wrap input[type="text"] {
      padding-right: 50px;
    }

    .input-icon-wrap input::placeholder {
      color: var(--text-subtle);
    }

    .input-icon-wrap input:focus {
      border-color: var(--input-focus);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(244, 96, 12, 0.12);
    }

    /* Eye toggle button */
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-subtle);
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: 5px;
      transition: color 0.2s;
    }

    .eye-btn:hover { color: var(--text-muted); }
    .eye-btn:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }

    /* ── Checkbox row ── */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--input-border);
      border-radius: 4px;
      background: var(--input-bg);
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .checkbox-row input[type="checkbox"]:checked {
      background: var(--orange);
      border-color: var(--orange);
    }

    .checkbox-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 1px;
      width: 8px;
      height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }

    .checkbox-label {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* ── Primary Button ── */
    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      background: var(--orange);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--orange-hover);
      box-shadow: 0 4px 20px var(--orange-glow);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Loading spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-label { transition: opacity 0.15s; }

    /* ── Error / Success Messages ── */
    .alert {
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      display: none;
    }

    .alert.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .alert.visible { display: block; }

    /* Shake animation on error */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      18%       { transform: translateX(-7px); }
      36%       { transform: translateX(7px); }
      54%       { transform: translateX(-5px); }
      72%       { transform: translateX(5px); }
      90%       { transform: translateX(-3px); }
    }

    .shake { animation: shake 0.45s ease-out; }

    /* ── Bottom links ── */
    .bottom-links {
      margin-top: 22px;
      text-align: center;
    }

    .bottom-links a {
      font-size: 12px;
      color: var(--text-subtle);
      text-decoration: none;
      transition: color 0.2s;
    }

    .bottom-links a:hover { color: var(--orange); }

    .forgot-trigger {
      display: block;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-subtle);
      cursor: pointer;
      margin: 10px auto 0;
      transition: color 0.2s;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255,255,255,0.15);
    }

    .forgot-trigger:hover { color: var(--orange); text-decoration-color: var(--orange); }

    /* ── Forgot Password Inline Panel ── */
    .forgot-panel {
      margin-top: 16px;
      padding: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      display: none;
      animation: fadeSlideIn 0.25s ease;
    }

    .forgot-panel.open { display: block; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .forgot-panel p {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .forgot-panel .input-icon-wrap input {
      padding-right: 14px; /* no eye toggle in reset */
    }

    .btn-reset {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--orange);
      border-radius: var(--radius-sm);
      color: var(--orange);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-reset:hover { background: var(--orange); color: #fff; }

    .reset-msg {
      margin-top: 10px;
      font-size: 12px;
      color: var(--success-text);
      display: none;
    }

    .reset-msg.visible { display: block; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 24px 0 20px;
    }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 36px 24px 28px; }
      .heading { font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="card" id="loginCard">

      <!-- Logo -->
      <div class="logo-wrap">
        <img src="logo.png" alt="STEMulus KidsTech" draggable="false" />
      </div>

      <!-- Portal label -->
      <p class="portal-label">Administrator Portal</p>

      <!-- Heading -->
      <h1 class="heading">Welcome back</h1>
      <p class="subtext">Sign in to manage your academy</p>

      <!-- Error alert -->
      <div class="alert error" id="errorAlert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate autocomplete="off">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="emailInput">Email address</label>
          <div class="input-icon-wrap">
            <input
              type="email"
              id="emailInput"
              name="email"
              placeholder="admin@stemuluskidstech.com"
              autocomplete="username"
              spellcheck="false"
              required
            />
            <!-- Envelope SVG -->
            <span class="icon-left" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="input-icon-wrap">
            <input
              type="password"
              id="passwordInput"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <!-- Lock SVG -->
            <span class="icon-left" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <!-- Eye toggle -->
            <button
              type="button"
              class="eye-btn"
              id="eyeBtn"
              aria-label="Show password"
              tabindex="0"
            >
              <!-- Eye open -->
              <svg id="eyeOpen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye closed (hidden by default) -->
              <svg id="eyeClosed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Keep me signed in -->
        <label class="checkbox-row">
          <input type="checkbox" id="keepSignedIn" />
          <span class="checkbox-label">Keep me signed in</span>
        </label>

        <!-- Submit -->
        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-label" id="btnLabel">Sign In</span>
        </button>

      </form>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Bottom links -->
      <div class="bottom-links">
        <a href="mailto:admin@stemuluskidstech.com">
          Forgot access? Email admin@stemuluskidstech.com
        </a>
        <button class="forgot-trigger" id="forgotTrigger" type="button">
          Request a password reset
        </button>
      </div>

      <!-- Forgot password inline panel -->
      <div class="forgot-panel" id="forgotPanel" role="region" aria-label="Password reset">
        <p>Enter your admin email address and a reset request will be logged for review.</p>

        <div class="input-icon-wrap">
          <input
            type="email"
            id="resetEmailInput"
            placeholder="Your admin email address"
            autocomplete="off"
          />
          <span class="icon-left" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
        </div>

        <button class="btn-reset" id="resetSubmitBtn" type="button">Request Reset</button>
        <p class="reset-msg" id="resetMsg">
          Request logged — the academy admin will contact you shortly.
        </p>
      </div>

    </div>

    <p class="footer-note">STEMulus KidsTech &mdash; Internal use only</p>
  </div>

  <!-- Dashboard Engine (provides DashboardEngine.login()) -->
  <script src="assets/js/dashboard-engine.min.js" defer></script>

  <script>
    /* ══════════════════════════════════════════════
       EYE TOGGLE
    ══════════════════════════════════════════════ */
    (function () {
      var passwordInput = document.getElementById('passwordInput');
      var eyeBtn        = document.getElementById('eyeBtn');
      var eyeOpen       = document.getElementById('eyeOpen');
      var eyeClosed     = document.getElementById('eyeClosed');

      eyeBtn.addEventListener('click', function () {
        var isPassword = passwordInput.type === 'password';
        passwordInput.type    = isPassword ? 'text' : 'password';
        eyeOpen.style.display = isPassword ? 'none'  : 'block';
        eyeClosed.style.display = isPassword ? 'block' : 'none';
        eyeBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    })();

    /* ══════════════════════════════════════════════
       FORGOT PASSWORD PANEL TOGGLE
    ══════════════════════════════════════════════ */
    (function () {
      var trigger = document.getElementById('forgotTrigger');
      var panel   = document.getElementById('forgotPanel');

      trigger.addEventListener('click', function () {
        var isOpen = panel.classList.contains('open');
        panel.classList.toggle('open');
        trigger.textContent = isOpen ? 'Request a password reset' : 'Cancel reset request';
      });
    })();

    /* ══════════════════════════════════════════════
       FORGOT PASSWORD SUBMIT
    ══════════════════════════════════════════════ */
    (function () {
      var resetBtn   = document.getElementById('resetSubmitBtn');
      var resetEmail = document.getElementById('resetEmailInput');
      var resetMsg   = document.getElementById('resetMsg');

      resetBtn.addEventListener('click', function () {
        var email = (resetEmail.value || '').trim();
        if (!email || !email.includes('@')) {
          resetEmail.focus();
          resetEmail.style.borderColor = 'var(--error-border)';
          return;
        }
        resetEmail.style.borderColor = '';

        // Attempt to log via DashboardEngine if available
        try {
          if (typeof DashboardEngine !== 'undefined' && DashboardEngine.db) {
            var db = DashboardEngine.db;
            if (!db.passwordResetRequests) db.passwordResetRequests = [];
            db.passwordResetRequests.push({
              email: email,
              requestedAt: new Date().toISOString(),
              status: 'pending'
            });
            // Persist if DashboardEngine exposes a save method
            if (typeof DashboardEngine.saveDb === 'function') {
              DashboardEngine.saveDb();
            } else if (typeof DashboardEngine.save === 'function') {
              DashboardEngine.save();
            }
          }
        } catch (err) {
          // Fail silently — still show confirmation
        }

        resetBtn.disabled = true;
        resetBtn.textContent = 'Request sent';
        resetEmail.disabled = true;
        resetMsg.classList.add('visible');
      });
    })();

    /* ══════════════════════════════════════════════
       MAIN LOGIN LOGIC
    ══════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', function () {
      /* ── 1. Pre-redirect: if valid admin session already exists, skip login ── */
      try {
        if (typeof DashboardEngine !== 'undefined') {
          var session = DashboardEngine.getSession ? DashboardEngine.getSession() : null;
          // Also check localStorage/sessionStorage fallback
          if (!session) {
            var raw = sessionStorage.getItem('stemulus_session') || localStorage.getItem('stemulus_session');
            if (raw) { try { session = JSON.parse(raw); } catch (_) {} }
          }
          if (session && session.role === 'admin' && session.valid !== false) {
            window.location.replace('admin-dashboard.html');
            return;
          }
        }
      } catch (sessionErr) {
        // No session — continue to show login form
      }

      /* ── 2. Wire up form submission ── */
      var form       = document.getElementById('loginForm');
      var submitBtn  = document.getElementById('submitBtn');
      var btnLabel   = document.getElementById('btnLabel');
      var errorAlert = document.getElementById('errorAlert');
      var loginCard  = document.getElementById('loginCard');
      var keepSignedIn = document.getElementById('keepSignedIn');

      function showError(message) {
        errorAlert.textContent = message;
        errorAlert.classList.add('visible');
        // Shake the card
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // Force reflow
        loginCard.classList.add('shake');
        loginCard.addEventListener('animationend', function handler() {
          loginCard.classList.remove('shake');
          loginCard.removeEventListener('animationend', handler);
        });
      }

      function hideError() {
        errorAlert.classList.remove('visible');
        errorAlert.textContent = '';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        if (loading) {
          btnLabel.textContent = 'Signing in…';
          // Insert spinner before label
          var spinner = document.createElement('span');
          spinner.className = 'spinner';
          spinner.id = 'loginSpinner';
          submitBtn.insertBefore(spinner, submitBtn.firstChild);
        } else {
          btnLabel.textContent = 'Sign In';
          var existingSpinner = document.getElementById('loginSpinner');
          if (existingSpinner) existingSpinner.remove();
        }
      }

      async function handleLogin(email, password) {
        hideError();
        setLoading(true);

        try {
          if (typeof DashboardEngine === 'undefined') {
            throw new Error('System error — engine not loaded. Please refresh.');
          }

          var result = await DashboardEngine.login(email, password);

          if (!result) {
            throw new Error('Invalid email or password.');
          }

          // Normalise: result may be a session object or boolean
          var role = null;
          if (typeof result === 'object') {
            role = result.role || (result.user && result.user.role) || null;
          } else if (result === true) {
            // Check active session post-login
            var sess = DashboardEngine.getSession ? DashboardEngine.getSession() : null;
            if (sess) role = sess.role;
          }

          if (role !== 'admin') {
            // Log out just in case a non-admin slipped through
            if (typeof DashboardEngine.logout === 'function') DashboardEngine.logout();
            throw new Error('Access denied. This portal is for administrators only.');
          }

          // Honour "keep me signed in"
          if (keepSignedIn.checked) {
            try { localStorage.setItem('stemulus_keep_signed_in', '1'); } catch (_) {}
          }

          // Success — redirect
          window.location.href = 'admin-dashboard.html';

        } catch (err) {
          setLoading(false);
          showError(err.message || 'Sign-in failed. Please try again.');
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email    = document.getElementById('emailInput').value.trim();
        var password = document.getElementById('passwordInput').value;

        if (!email) { showError('Please enter your email address.'); return; }
        if (!password) { showError('Please enter your password.'); return; }

        handleLogin(email, password);
      });

      // Clear error on input
      document.getElementById('emailInput').addEventListener('input', hideError);
      document.getElementById('passwordInput').addEventListener('input', hideError);
    });
  </script>

</body>
</html>
