<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=slides/index.html">
  <title>STEMulus Kids Tech Academy — Curriculum Gateway</title>
  <link rel="icon" type="image/png" href="slides/assets/3d/stemulus-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // Immediate client-side redirection
    if (!window.location.hash.includes('noredirect')) {
      window.location.replace("slides/index.html");
    }
  </script>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --sky: #0284C7;
      --sky-light: #E0F2FE;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .splash-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.06);
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.1));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--sky-light);
      color: var(--sky);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }
    p {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #E2E8F0;
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tactile-btn {
      background: linear-gradient(180deg, #BAE6FD 0%, #38BDF8 100%);
      color: #0369A1;
      border: 1px solid #7DD3FC;
      padding: 12px 28px;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 3px 0 #0284C7, 0 6px 14px rgba(56, 189, 248, 0.28);
      transition: all 0.15s ease;
    }
    .tactile-btn:hover {
      background: linear-gradient(180deg, #E0F2FE 0%, #38BDF8 100%);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <img src="slides/assets/3d/stemulus-logo.png" class="logo-img" alt="STEMulus Logo">
    <div class="badge">Global Curriculum Portal</div>
    <h1>STEMulus Kids Tech Academy</h1>
    <p>Launching the interactive global slide deck curriculum and practical engineering labs...</p>
    <div class="spinner"></div>
    <a href="slides/index.html" class="tactile-btn">
      <span>Enter Curriculum Portal &rarr;</span>
    </a>
  </div>
</body>
</html>
