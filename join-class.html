<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entering STEMulus Coding Classroom...</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/dashboard-engine.js"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .pulse-glow { animation: pulse-glow 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800/80 border border-slate-700/80 rounded-3xl p-8 text-center shadow-2xl backdrop-blur-xl">
    <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center shadow-lg shadow-orange-500/25 pulse-glow">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
    </div>

    <h1 class="text-2xl font-black tracking-tight text-white mb-2" id="bridge-title">Connecting to Classroom...</h1>
    <p class="text-sm text-slate-400 mb-6" id="bridge-sub">Verifying attendance heartbeat and opening video session.</p>

    <div class="w-full bg-slate-700 rounded-full h-2 mb-6 overflow-hidden">
      <div id="bridge-bar" class="bg-gradient-to-r from-orange-500 to-amber-400 h-2 rounded-full transition-all duration-500 w-1/3"></div>
    </div>

    <div class="bg-slate-900/60 rounded-xl p-4 mb-6 border border-slate-700/50 text-left text-xs space-y-1.5" id="bridge-details">
      <div class="flex justify-between text-slate-400"><span>Session:</span> <strong class="text-slate-200" id="detail-session">...</strong></div>
      <div class="flex justify-between text-slate-400"><span>Student:</span> <strong class="text-slate-200" id="detail-student">...</strong></div>
      <div class="flex justify-between text-slate-400"><span>Instructor:</span> <strong class="text-slate-200" id="detail-mentor">...</strong></div>
    </div>

    <div class="space-y-3">
      <a id="btn-manual-join" href="#" class="inline-flex items-center justify-center w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 px-6 rounded-xl text-sm transition-all shadow-lg shadow-orange-600/30">
        Click here if not redirected in 3s &rarr;
      </a>
      <p class="text-[11px] text-slate-500">Live attendance timestamp verified by STEMulus Academic Engine</p>
    </div>
  </div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('id') || urlParams.get('sessionId') || '';
      const role = (urlParams.get('role') || 'student').toLowerCase();
      const directUrl = urlParams.get('url') || '';

      const detailSession = document.getElementById('detail-session');
      const detailStudent = document.getElementById('detail-student');
      const detailMentor = document.getElementById('detail-mentor');
      const bridgeBar = document.getElementById('bridge-bar');
      const btnManual = document.getElementById('btn-manual-join');

      // 1. Resolve schedule from DB
      let schedule = null;
      let targetMeetingUrl = directUrl || 'https://meet.google.com';

      if (typeof DashboardEngine !== 'undefined') {
        const db = DashboardEngine.getDB();
        const scheds = (db && db.schedules) || [];
        schedule = sessionId ? (scheds.find(s => s.id === sessionId) || null) : null;
      }

      if (schedule) {
        detailSession.textContent = schedule.course || 'Coding Session';
        detailStudent.textContent = schedule.studentName || 'Student';
        detailMentor.textContent = schedule.mentor || schedule.tutorName || 'Instructor';
        targetMeetingUrl = directUrl || schedule.link || 'https://meet.google.com';
      } else {
        detailSession.textContent = sessionId || 'Active Coding Track';
        detailStudent.textContent = 'STEMulus Coder';
        detailMentor.textContent = 'Faculty Instructor';
        targetMeetingUrl = directUrl || 'https://meet.google.com';
      }

      btnManual.href = targetMeetingUrl;

      // 2. Record live presence timestamp
      const nowIso = new Date().toISOString();
      const presencePayload = {
        sessionId: sessionId || ('ses-' + Date.now()),
        scheduleId: schedule ? schedule.id : sessionId,
        studentName: schedule ? schedule.studentName : 'Student',
        tutorName: schedule ? (schedule.mentor || schedule.tutorName) : 'Tutor',
        lastUpdated: nowIso
      };

      if (role === 'tutor') {
        presencePayload.tutorJoinedAt = nowIso;
        presencePayload.tutorPresent = true;
      } else {
        presencePayload.studentJoinedAt = nowIso;
        presencePayload.studentPresent = true;
      }

      // Record in localStorage
      try {
        const liveKey = 'stemulus_live_presence';
        const liveStore = JSON.parse(localStorage.getItem(liveKey) || '{}');
        liveStore[presencePayload.sessionId] = Object.assign({}, liveStore[presencePayload.sessionId] || {}, presencePayload);
        localStorage.setItem(liveKey, JSON.stringify(liveStore));
      } catch(e) {}

      // Record in Firestore if available
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
        try {
          firebase.firestore().collection('live_sessions').doc(presencePayload.sessionId).set(presencePayload, { merge: true })
            .catch(err => console.warn('[JoinBridge] Cloud heartbeat error:', err));
        } catch(e) {}
      }

      // Animate progress bar to 100%
      setTimeout(() => { if (bridgeBar) bridgeBar.style.width = '100%'; }, 150);

      // 3. Fast redirect in 1500ms (prevent redirect if test=1)
      const isTest = urlParams.get('test') === '1' || window.location.search.includes('test=1');
      if (!isTest) {
        setTimeout(() => {
          window.location.replace(targetMeetingUrl);
        }, 1500);
      }
    })();
  </script>
</body>
</html>
