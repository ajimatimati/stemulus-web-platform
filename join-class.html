<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Live Classroom | STEMulus</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/css/tailwind-output.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="max-w-md w-full bg-white border-2 border-slate-200 border-b-4 border-b-slate-300 rounded-3xl p-8 text-center shadow-lg">
    <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-orange-50 border-2 border-orange-200 border-b-4 border-b-orange-300 flex items-center justify-center text-orange-600">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2" stroke-width="2.2"/></svg>
    </div>
    <h1 class="text-xl font-black text-slate-900 mb-2">Connecting to Live Classroom</h1>
    <p class="text-sm text-slate-500 mb-6">Launching your Google Meet room. Safeguarding 1080p recording and live session telemetry active.</p>

    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold mb-6">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span>1080p Telemetry and Transcript Initialized</span>
    </div>

    <div>
      <a id="btn-direct-launch" href="https://meet.google.com" class="inline-block w-full py-3.5 px-6 rounded-2xl bg-orange-600 hover:bg-orange-500 border-2 border-orange-600 border-b-4 border-b-orange-800 text-white font-extrabold text-sm transition-all shadow-sm">
        Open Meeting Directly &rarr;
      </a>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var rawUrl = params.get('url') || params.get('meetUrl') || '';
      var scheduleId = params.get('id') || params.get('scheduleId') || '';
      var studentName = params.get('student') || params.get('studentName') || 'Student';
      var courseName = params.get('course') || 'STEMulus Live Session';
      var tutorName = params.get('tutor') || 'Faculty Mentor';
      var role = params.get('role') || 'participant';
      var sessionId = 'ses_' + Date.now();

      // If no direct URL in params, inspect local database
      if (!rawUrl && scheduleId) {
        try {
          var db = JSON.parse(localStorage.getItem('stemulus_db') || '{}');
          if (Array.isArray(db.schedules)) {
            var match = db.schedules.find(function(s) { return s && s.id === scheduleId; });
            if (match) {
              rawUrl = match.link || match.meetLink || '';
              if (match.studentName) studentName = match.studentName;
              if (match.course) courseName = match.course;
              if (match.tutorName || match.mentor) tutorName = match.tutorName || match.mentor;
            }
          }
        } catch(e) {}
      }

      var targetMeetingUrl = (rawUrl && rawUrl.startsWith('http')) ? rawUrl : 'https://meet.google.com';
      var btn = document.getElementById('btn-direct-launch');
      if (btn) btn.href = targetMeetingUrl;

      // 1. Trigger 1080p Recording Safeguarding Telemetry
      try {
        var recKey = 'stemulus_recorded_sessions';
        var recList = JSON.parse(localStorage.getItem(recKey) || '[]');
        recList.unshift({
          id: 'rec-' + Date.now(),
          sessionId: sessionId,
          scheduleId: scheduleId,
          course: courseName,
          student: studentName,
          tutor: tutorName,
          meetingUrl: targetMeetingUrl,
          role: role,
          resolution: '1080p HD',
          status: 'Recording Telemetry Active',
          triggeredAt: new Date().toISOString(),
          recordingMode: '1080p_hd_companion_and_cloud'
        });
        localStorage.setItem(recKey, JSON.stringify(recList.slice(0, 50)));
      } catch(e) {}

      // 2. Trigger Real-time Transcript & Monitoring Telemetry
      try {
        var transKey = 'stemulus_session_transcripts';
        var transList = JSON.parse(localStorage.getItem(transKey) || '[]');
        transList.unshift({
          id: 'trans-' + Date.now(),
          sessionId: sessionId,
          scheduleId: scheduleId,
          course: courseName,
          student: studentName,
          tutor: tutorName,
          role: role,
          active: true,
          transcriptStartedAt: new Date().toISOString(),
          status: 'Live Ingestion',
          meetingUrl: targetMeetingUrl
        });
        localStorage.setItem(transKey, JSON.stringify(transList.slice(0, 50)));
      } catch(e) {}

      // 3. Record Live Presence & Session Monitoring Telemetry
      try {
        var nowIso = new Date().toISOString();
        var cleanRole = String(role || 'participant').toLowerCase().trim();
        var isTutor = cleanRole === 'tutor';
        var key = scheduleId || sessionId;

        var presKey = 'stemulus_live_presence';
        var presStore = JSON.parse(localStorage.getItem(presKey) || '{}');
        var presEntry = presStore[key] || {};
        presEntry.sessionId = sessionId;
        presEntry.scheduleId = scheduleId || key;
        presEntry.courseName = courseName;
        presEntry.studentName = studentName;
        presEntry.tutorName = tutorName;
        presEntry.meetingUrl = targetMeetingUrl;
        presEntry.lastHeartbeat = Date.now();
        presEntry.status = 'active';
        if (isTutor) {
          presEntry.tutorJoinedAt = presEntry.tutorJoinedAt || nowIso;
          presEntry.tutorPresent = true;
        } else {
          presEntry.studentJoinedAt = presEntry.studentJoinedAt || nowIso;
          presEntry.studentPresent = true;
        }
        presStore[key] = presEntry;
        localStorage.setItem(presKey, JSON.stringify(presStore));

        var monKey = 'stemulus_monitored_sessions';
        var monStore = JSON.parse(localStorage.getItem(monKey) || '{}');
        var monEntry = monStore[key] || {
          sessionId: sessionId,
          scheduleId: scheduleId || key,
          courseName: courseName,
          studentName: studentName,
          tutorName: tutorName,
          meetingUrl: targetMeetingUrl,
          scheduledDate: nowIso.slice(0, 10),
          actualStartTime: nowIso,
          overlapDurationSec: 0,
          tutorDurationSec: 0,
          studentDurationSec: 0,
          sessionState: 'WAITING_FOR_PARTNER'
        };
        if (isTutor) {
          monEntry.tutorJoinedAt = monEntry.tutorJoinedAt || nowIso;
          monEntry.tutorLastPing = Date.now();
        } else {
          monEntry.studentJoinedAt = monEntry.studentJoinedAt || nowIso;
          monEntry.studentLastPing = Date.now();
        }
        if (monEntry.tutorJoinedAt && monEntry.studentJoinedAt) {
          monEntry.sessionState = 'ACTIVE_OVERLAP';
          monEntry.verifiedHeld = true;
        }
        monStore[key] = monEntry;
        localStorage.setItem(monKey, JSON.stringify(monStore));
      } catch(e) {}

      // 4. Immediately redirect without hesitation
      setTimeout(function() {
        window.location.replace(targetMeetingUrl);
      }, 350);
    })();
  </script>
</body>
</html>
