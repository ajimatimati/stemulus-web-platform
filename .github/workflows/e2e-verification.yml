name: STEMulus E2E Portal Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Tooling Dependencies
        run: |
          cd tools
          npm ci || npm install
          cd ..

      - name: Build & Minify Production Assets
        run: node tools/minify.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute End-to-End Test Suite
        run: node tests/e2e_portal_goal_test.js
        env:
          CI: true
