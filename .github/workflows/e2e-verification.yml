name: STEMulus E2E Portal Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Tooling Dependencies
        run: |
          cd tools
          npm ci || npm install
          cd ..

      - name: Build & Minify Production Assets
        run: node tools/minify.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Complete 9-Aspect QA & UX Audit Suite
        run: node scripts/run_all_aspect_audits.js
        env:
          CI: true

      - name: Execute Mulu AI Mascot Engine E2E Verification
        run: node tests/verify_mulu_ai_mascot.js
        env:
          CI: true

      - name: Execute Core Portal Goal E2E Test Suite
        run: node tests/e2e_portal_goal_test.js
        env:
          CI: true
