# Netlify Build Configuration for STEMulus

[build]
  publish = "."

# Form submission settings
# Note: Email notifications must be configured in the Netlify dashboard:
# Site settings → Forms → Form notifications → Add notification → Email

# Redirect after successful form submission (optional - handled by JS)
# [[redirects]]
#   from = "/enroll-success"
#   to = "/enroll.html"
#   status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
