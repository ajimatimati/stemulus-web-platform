# Netlify Build Configuration for STEMulus

[build]
  command = "cd tools && npm install && cd .. && npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

# Scheduled notification runs:
# 06:00 UTC (07:00 WAT) - tutor digests + birthday alerts
# 17:00 UTC (18:00 WAT) - parent & tutor 24h reminders
[functions."scheduled-notifications"]
  schedule = "0 6,17 * * *"

# Automated Class Reminders (runs every 10 minutes):
# Evaluates 24h, 1h, and 10m windows and sends email + push alerts to both parents and tutors
[functions."class-reminders"]
  schedule = "*/10 * * * *"


# ── Redirects ────────────────────────────────────────────────────────────────

# Block .env and config files from ever being served publicly
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/**/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/whatsapp-bot/*"
  to = "/404.html"
  status = 404
  force = true

# Hall of Fame retired - redirect to Programs
[[redirects]]
  from = "/hall-of-fame.html"
  to = "/programs.html"
  status = 301

# Legacy / broken inbound links
[[redirects]]
  from = "/login.html"
  to = "/parent-login.html"
  status = 301

[[redirects]]
  from = "/why-stemulus.html"
  to = "/"
  status = 301

# Tutor login alias redirect
[[redirects]]
  from = "/tutor-login.html"
  to = "/parent-login.html?role=tutor"
  status = 301

# WebMCP API endpoint redirect
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

# Automated Class Reminders API endpoint redirect
[[redirects]]
  from = "/api/class-reminders"
  to = "/.netlify/functions/class-reminders"
  status = 200

# Trailing-slash canonicalisation (avoids duplicate content)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

