<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=parent-login.html?role=tutor">
  <title>Redirecting to Mentor Sign-In | STEMulus</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    window.location.replace('parent-login.html?role=tutor');
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .redirect-card {
      text-align: center;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f4600c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 700; }
    p { font-size: 0.875rem; color: #94a3b8; margin: 0 0 1.25rem; line-height: 1.5; }
    a { color: #f4600c; text-decoration: none; font-weight: 600; font-size: 0.875rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2>Opening Mentor Portal...</h2>
    <p>Directing you to the STEMulus instructor login console.</p>
    <a href="parent-login.html?role=tutor">Click here if you are not redirected automatically</a>
  </div>
</body>
</html>
